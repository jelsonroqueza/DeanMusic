name: DeanMusic Production banner migration

on:
  push:
    branches:
      - release/artist-banners-canvas-behavior-20261109
    paths:
      - .github/ops/apply-banner-migration.txt

permissions:
  contents: read

concurrency:
  group: deanmusic-production-banner-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded Production D1 baseline and banner migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: da14b2b9fb69210958abe2632e86812f
          CLOUDFLARE_D1_DATABASE_ID: 77f089ff-6bcd-417e-927a-4fc8e8bd04e0
        run: node .github/scripts/apply-production-banner-migration.mjs
