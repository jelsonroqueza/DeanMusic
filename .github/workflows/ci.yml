name: DeanMusic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build frontend
        run: npm run build
      - name: Bundle Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler
          npx wrangler pages functions build functions --outdir .wrangler/functions --output-config-path .wrangler/config.json
      - name: Validate all D1 migrations
        run: |
          python3 - <<'PY'
          import sqlite3
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("wrangler.toml").read_text(encoding="utf-8"))
          top_d1 = config.get("d1_databases", [])
          top_kv = config.get("kv_namespaces", [])
          production = config.get("env", {}).get("production", {})
          preview = config.get("env", {}).get("preview", {})
          production_d1 = production.get("d1_databases", [])
          production_kv = production.get("kv_namespaces", [])
          assert any(item.get("binding") == "DB" and item.get("database_id") == "77f089ff-6bcd-417e-927a-4fc8e8bd04e0" for item in production_d1), "Production DB binding is missing or does not point to DeanMusic D1."
          assert any(item.get("binding") == "MEDIA" and item.get("id") == "d962e53d719940c386c02a2da54b71ba" for item in production_kv), "Production MEDIA binding is missing or does not point to DeanMusic KV."
          assert not preview.get("d1_databases") and not preview.get("kv_namespaces"), "Preview must remain isolated until separate staging D1 and KV resources exist."
          assert preview.get("vars", {}).get("ADMIN_ACCESS_DISABLED") == "true", "Preview admin access must remain disabled."

          migration_dir = Path("cloudflare/migrations")
          migrations = sorted(migration_dir.glob("*.sql"))
          assert migrations, "No D1 migrations found."

          db = sqlite3.connect(":memory:")
          for migration in migrations:
              db.executescript(migration.read_text(encoding="utf-8"))
              print(f"Applied {migration.name} to the validation database.")

          expected = {
              "user", "session", "account", "verification", "artists", "albums",
              "tracks", "playlists", "playlist_tracks", "liked_tracks", "follows",
              "saved_albums", "recently_played", "admins"
          }
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          assert not missing, f"Missing tables after all migrations: {sorted(missing)}"

          album_columns = {row[1] for row in db.execute("PRAGMA table_info(albums)")}
          required_album_columns = {"description", "is_published", "published_at", "created_by"}
          missing_columns = required_album_columns - album_columns
          assert not missing_columns, f"Missing Admin Centre album columns: {sorted(missing_columns)}"

          track = db.execute("SELECT title, audio_path FROM tracks WHERE id='demo-midnight'").fetchone()
          assert track == ("Midnight Reverie", "browser-synth"), track
          print("All D1 migrations passed SQLite validation; Admin Centre schema and demo track are present.")
          PY
