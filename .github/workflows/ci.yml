name: DeanMusic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build frontend
        run: npm run build
      - name: Bundle Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler
          npx wrangler pages functions build functions --outdir .wrangler/functions --output-config-path .wrangler/config.json
      - name: Validate D1 migration
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path("cloudflare/migrations/0001_init.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.executescript(sql)
          expected = {
              "user", "session", "account", "verification", "artists", "albums",
              "tracks", "playlists", "playlist_tracks", "liked_tracks", "follows",
              "saved_albums", "recently_played"
          }
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          track = db.execute("SELECT title, audio_path FROM tracks WHERE id='demo-midnight'").fetchone()
          assert track == ("Midnight Reverie", "browser-synth"), track
          print("D1 migration SQL passed SQLite validation; all expected tables and demo track exist.")
          PY
