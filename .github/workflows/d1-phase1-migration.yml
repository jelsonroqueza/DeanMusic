name: DeanMusic Phase 1 D1 migration

on:
  push:
    branches:
      - ops/d1-phase1-migration-20261109
    paths:
      - .github/scripts/d1-phase1-migration.mjs
      - .github/workflows/d1-phase1-migration.yml
      - .github/ops/d1-phase1-run.txt

permissions:
  contents: read

concurrency:
  group: deanmusic-production-d1-phase1
  cancel-in-progress: false

jobs:
  migrate:
    name: Guarded Production D1 migration
    if: github.ref == 'refs/heads/ops/d1-phase1-migration-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect, apply and verify Phase 1 D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: da14b2b9fb69210958abe2632e86812f
          CLOUDFLARE_D1_DATABASE_ID: 77f089ff-6bcd-417e-927a-4fc8e8bd04e0
        run: node .github/scripts/d1-phase1-migration.mjs
